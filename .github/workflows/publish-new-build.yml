name: Publish new build
run-name: Publish Watchtower ${{ github.event.release.tag_name || inputs.version }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: watchtower-publish-${{ github.event_name == 'release' && 'release' || inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    uses: ./.github/workflows/build-docker-image.yml
    with:
      version: ${{ github.event.release.tag_name || inputs.version }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
