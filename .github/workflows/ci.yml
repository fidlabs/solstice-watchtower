# Tests on every pull request and push to main. No secrets: nothing here talks to a chain or sends mail.
name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['site/data/**'] # the reader's record commits
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: for f in bin/*.js lib/*.js site/lib/*.js; do node --check "$f"; done
      - run: npm test
      - run: npm test --prefix alerts-service
