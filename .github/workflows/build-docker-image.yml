name: Build Docker images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
    outputs:
      version:
        description: Normalized published image version
        value: ${{ jobs.validate.outputs.version }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and resolve source commit
        id: source
        env:
          VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          version="${VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#version} > 128 )); then
            echo 'Expected a Docker-compatible version, e.g. 1.2.3 or v1.2.3-rc.1' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = release ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run test:alerts

  build_and_push:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: solstice-watchtower-site
            context: .
            dockerfile: Dockerfile
          - repository: solstice-watchtower-alerts
            context: alerts-service
            dockerfile: alerts-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"
          registry-type: public

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: public.ecr.aws/f4h6r4m9/${{ matrix.repository }}:${{ needs.validate.outputs.version }}
